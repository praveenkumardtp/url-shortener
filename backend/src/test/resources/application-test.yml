spring:
  datasource:
    url: jdbc:h2:mem:url_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false

app:
  shortener:
    base-url: http://localhost:8082
    default-expiration-days: 30
    cache-ttl-minutes: 60
