version: '3.8'

services:
  url-db:
    image: postgres:16-alpine
    container_name: urlshortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: url_shortener_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - url_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  url-redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - url_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  url-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-backend-app
    restart: unless-stopped
    depends_on:
      url-db:
        condition: service_healthy
      url-redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://url-db:5432/url_shortener_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: url-redis
      REDIS_PORT: 6379
      APP_BASE_URL: http://localhost:8082
    ports:
      - "8082:8082"

volumes:
  url_pgdata:
  url_redisdata:
